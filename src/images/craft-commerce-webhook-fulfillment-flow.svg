<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="920" height="480" rx="16" fill="url(#flowBg)" stroke="#1e293b" />

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Stripe Webhook Signature Verification &amp; Fulfillment Flow</text>
    <text y="20" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Cryptographic HMAC-SHA256 handshake &bull; Idempotent processing &bull; Real-time SSE Stock Decrement</text>
  </g>

  <!-- Step 1: Customer Checkout -->
  <g transform="translate(40, 80)">
    <rect width="180" height="150" rx="10" fill="#0f172a" stroke="#334155" />
    <circle cx="28" cy="30" r="12" fill="#3b82f6" />
    <text x="24" y="34" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>
    <text x="48" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Cart Checkout</text>
    
    <text x="18" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8">Customer initiates</text>
    <text x="18" y="86" font-family="sans-serif" font-size="11" fill="#94a3b8">order creation.</text>
    <text x="18" y="112" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Captures price snapshot</text>
    <text x="18" y="128" font-family="monospace" font-size="9" fill="#64748b">OrderItem.priceAtPurchase</text>
  </g>

  <!-- Step 2: Stripe Payment -->
  <g transform="translate(260, 80)">
    <rect width="180" height="150" rx="10" fill="#0f172a" stroke="#334155" />
    <circle cx="28" cy="30" r="12" fill="#6366f1" />
    <text x="24" y="34" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>
    <text x="48" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Stripe Payment</text>
    
    <text x="18" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8">Payment processed via</text>
    <text x="18" y="86" font-family="sans-serif" font-size="11" fill="#94a3b8">Stripe PaymentIntent.</text>
    <text x="18" y="112" font-family="sans-serif" font-size="10" font-weight="600" fill="#818cf8">Event Emitted</text>
    <text x="18" y="128" font-family="monospace" font-size="9" fill="#64748b">checkout.session.completed</text>
  </g>

  <!-- Step 3: Raw Buffer & HMAC Verifier -->
  <g transform="translate(480, 80)">
    <rect width="180" height="150" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#10b981" />
    <text x="24" y="34" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>
    <text x="48" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">HMAC Verification</text>
    
    <text x="18" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8">express.raw buffer</text>
    <text x="18" y="86" font-family="sans-serif" font-size="11" fill="#94a3b8">header: stripe-signature</text>
    <text x="18" y="112" font-family="sans-serif" font-size="10" font-weight="600" fill="#34d399">HMAC-SHA256 Check</text>
    <text x="18" y="128" font-family="monospace" font-size="9" fill="#64748b">t=timestamp, v1=sig</text>
  </g>

  <!-- Step 4: Fulfillment Pipeline -->
  <g transform="translate(700, 80)">
    <rect width="180" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="28" cy="30" r="12" fill="#f59e0b" />
    <text x="24" y="34" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">4</text>
    <text x="48" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">Order Fulfillment</text>
    
    <text x="18" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8">Order -> PROCESSING</text>
    <text x="18" y="86" font-family="sans-serif" font-size="11" fill="#94a3b8">Payment -> COMPLETED</text>
    <text x="18" y="112" font-family="sans-serif" font-size="10" font-weight="600" fill="#fbbf24">Asynchronous actions</text>
    <text x="18" y="128" font-family="monospace" font-size="9" fill="#64748b">Stock decrease &amp; Email</text>
  </g>

  <!-- Bottom Row: Downstream Broadcasts -->
  <g transform="translate(40, 270)">
    <!-- SSE Real-time Box -->
    <rect x="220" y="0" width="300" height="150" rx="10" fill="#022c22" stroke="#059669" />
    <text x="240" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">Server-Sent Events (SSE) Broadcast</text>
    <text x="240" y="52" font-family="sans-serif" font-size="11" fill="#a7f3d0">&bull; Automatically decrements product stock</text>
    <text x="240" y="72" font-family="sans-serif" font-size="11" fill="#a7f3d0">&bull; Pushes INVENTORY_UPDATE payload to all clients</text>
    <text x="240" y="92" font-family="sans-serif" font-size="11" fill="#a7f3d0">&bull; Triggers low-stock warnings in real time</text>
    <text x="240" y="120" font-family="monospace" font-size="10" fill="#6ee7b7">data: {"productId": "...", "newStock": 11}</text>

    <!-- Nodemailer & Resend Box -->
    <rect x="540" y="0" width="300" height="150" rx="10" fill="#1e1b4b" stroke="#4f46e5" />
    <text x="560" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">Automated Transactional Receipt</text>
    <text x="560" y="52" font-family="sans-serif" font-size="11" fill="#c7d2fe">&bull; Dispatched via Resend REST or Nodemailer</text>
    <text x="560" y="72" font-family="sans-serif" font-size="11" fill="#c7d2fe">&bull; Renders responsive HTML receipt with snapshots</text>
    <text x="560" y="92" font-family="sans-serif" font-size="11" fill="#c7d2fe">&bull; Records recipient messageId and audit outbox</text>
    <text x="560" y="120" font-family="monospace" font-size="10" fill="#818cf8">Nodemailer HTML Template &bull; 200 OK</text>
  </g>

  <!-- Flow Arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 220 155 L 260 155" />
    <path d="M 440 155 L 480 155" />
    <path d="M 660 155 L 700 155" />
    <path d="M 790 230 L 790 250 L 370 250 L 370 270" />
    <path d="M 790 230 L 790 250 L 690 250 L 690 270" />
  </g>
</svg>